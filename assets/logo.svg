<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#191330"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Loopback Audio Wire Orbit (PipeWire Node Circuit) -->
  <circle cx="250" cy="240" r="165" fill="none" stroke="url(#pulseGrad)" stroke-width="3" stroke-dasharray="10 14" stroke-opacity="0.5"/>
  <circle cx="250" cy="240" r="125" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Studio Condenser Microphone Capsule -->
  <!-- Capsule Mesh Grill -->
  <rect x="205" y="115" width="90" height="135" rx="45" fill="#1b1535" stroke="url(#micGrad)" stroke-width="5" filter="url(#glow)"/>
  <!-- Mesh Grill Lines -->
  <line x1="220" y1="150" x2="280" y2="150" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="215" y1="175" x2="285" y2="175" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="220" y1="200" x2="280" y2="200" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="250" y1="130" x2="250" y2="225" stroke="#ec4899" stroke-width="3"/>

  <!-- Microphone U-Mount Cradle Bracket -->
  <path d="M 175 200 C 175 300 325 300 325 200" fill="none" stroke="url(#micGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Mount Stem & Base -->
  <line x1="250" y1="275" x2="250" y2="355" stroke="url(#micGrad)" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="250" cy="365" rx="70" ry="16" fill="#201840" stroke="#00f2fe" stroke-width="3"/>

  <!-- MPV Play Chevron / Loopback Audio Pulse Nodes -->
  <circle cx="395" cy="240" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <polygon points="390,234 404,240 390,246" fill="#0e0a1a"/>
  
  <circle cx="105" cy="240" r="10" fill="#ec4899" filter="url(#glow)"/>
</svg>
